name: Release CLI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        working-directory: archly-cli
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o archly.exe .
            zip "archly_${{ matrix.goos }}_${{ matrix.goarch }}.zip" archly.exe
          else
            go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o archly .
            tar czf "archly_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" archly
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archly_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            archly-cli/archly_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            archly-cli/archly_${{ matrix.goos }}_${{ matrix.goarch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
